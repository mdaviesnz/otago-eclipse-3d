name: CI / Deploy

# Wrangler direct upload is used rather than Cloudflare's Git integration, because the Git
# integration deploys on push regardless of whether checks pass. Going through Actions means a
# failing test actually blocks the deploy — which matters here, since the site ships a
# generated data file whose correctness is not visible by eye.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on PR branches, but never abort an in-flight production deploy on main.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No pip installs: these checks deliberately use only the standard library so they
      # cannot break because of an upstream package.
      - name: Secrets, catalogue integrity, asset references
        run: python tests/check_static.py

  test:
    name: Browser smoke tests
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Node 24 matches the runner's action runtime and the current LTS, so CI and a local
      # `winget install OpenJS.NodeJS.LTS` machine run the same major version.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # app.css is committed so a fresh clone works without a build. Rebuild it here and fail
      # if the result differs — that means someone changed classes in the HTML and forgot to
      # regenerate, which would ship a stylesheet missing those utilities.
      - name: Stylesheet is up to date with the markup
        run: |
          cp app.css /tmp/app.css.committed
          npm run build:css
          if ! git diff --quiet -- app.css; then
            echo "::error::app.css is stale — run 'npm run build:css' and commit the result"
            diff <(tr ',' '\n' < /tmp/app.css.committed) <(tr ',' '\n' < app.css) | head -40
            exit 1
          fi
          echo "app.css matches the markup"

      # Assemble dist/ from the canonical SITE_FILES list in tests/check_static.py and run
      # Playwright against dist/ so the smoke tests exercise the exact artifact we deploy.
      - name: Assemble dist/
        run: |
          mkdir -p dist
          python3 -c 'import shutil, tests.check_static as c; [shutil.copy2(f, "dist/") for f in c.SITE_FILES]'

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          SERVE_DIR: dist

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [check, test]
    # Skip for PRs raised from forks, which cannot read repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Fail with something actionable. Without this, a setup mistake surfaces as an opaque
      # "npx exited 1" from wrangler several steps later.
      #
      # Unlike Pages, `wrangler deploy` creates the Worker on first run, so the "project does
      # not exist" failure mode that blocked the first deploys is simply gone. What remains is
      # the token: one scoped only to Cloudflare Pages authenticates perfectly well and then
      # fails at upload. Listing Workers scripts is free and proves the permission is there.
      - name: Preflight — Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions. See DEPLOYMENT.md."
            exit 1
          fi

          code=$(curl -s -o /tmp/cf.json -w '%{http_code}' \
            --max-time 15 --retry 2 --retry-connrefused \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts")

          case "$code" in
            200)
              echo "Secrets present; the token can manage Workers on this account." ;;
            401|403)
              echo "::error::Cloudflare rejected the API token for Workers (HTTP $code)."
              echo ""
              echo "The token needs Account -> Workers Scripts -> Edit, and must belong to the"
              echo "account in CLOUDFLARE_ACCOUNT_ID. A token scoped only to Cloudflare Pages"
              echo "will reach exactly this point and no further — see DEPLOYMENT.md."
              exit 1 ;;
            *)
              echo "::warning::Unexpected HTTP $code listing Workers scripts; continuing anyway."
              head -c 400 /tmp/cf.json || true ;;
          esac

      # Assemble exactly what should be public from the single source of truth in
      # tests/check_static.py (SITE_FILES). The precompute pipeline, tests and CI config
      # stay out of the deployed artifact. wrangler.jsonc points `assets.directory` here.
      - name: Assemble dist/
        run: |
          mkdir -p dist
          python3 -c 'import shutil, tests.check_static as c; [shutil.copy2(f, "dist/") for f in c.SITE_FILES]'
          echo "Deploying:"; ls -lh dist/

      - name: Publish to production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: prod
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

      # Pages gave every branch its own preview deployment. The Workers equivalent is uploading
      # a *version*: it gets its own preview URL and takes no production traffic until promoted,
      # which it never is here — merging to main redeploys from scratch.
      - name: Upload preview version
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        id: preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: versions upload

      # Preview URLs are not surfaced automatically the way Pages' were, so put the URL
      # somewhere a reviewer will find it without opening the step log.
      - name: Link the deployment
        env:
          URL: ${{ steps.prod.outputs.deployment-url || steps.preview.outputs.deployment-url }}
        run: |
          if [ -n "$URL" ]; then
            echo "### Deployed: <$URL>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Deployed — wrangler reported no URL; see the publish step log." >> "$GITHUB_STEP_SUMMARY"
          fi
