name: CI / Deploy

# Wrangler direct upload is used rather than Cloudflare's Git integration, because the Git
# integration deploys on push regardless of whether checks pass. Going through Actions means a
# failing test actually blocks the deploy — which matters here, since the site ships a
# generated data file whose correctness is not visible by eye.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No pip installs: these checks deliberately use only the standard library so they
      # cannot break because of an upstream package.
      - name: Secrets, catalogue integrity, asset references
        run: python tests/check_static.py

  test:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 matches the runner's action runtime and the current LTS, so CI and a local
      # `winget install OpenJS.NodeJS.LTS` machine run the same major version.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci || npm install

      # app.css is committed so a fresh clone works without a build. Rebuild it here and fail
      # if the result differs — that means someone changed classes in the HTML and forgot to
      # regenerate, which would ship a stylesheet missing those utilities.
      - name: Stylesheet is up to date with the markup
        run: |
          cp app.css /tmp/app.css.committed
          npm run build:css
          if ! diff -q /tmp/app.css.committed app.css; then
            echo "::error::app.css is stale — run 'npm run build:css' and commit the result"
            diff <(tr ',' '\n' < /tmp/app.css.committed) <(tr ',' '\n' < app.css) | head -40
            exit 1
          fi
          echo "app.css matches the markup"

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [check, test]
    # Skip for PRs raised from forks, which cannot read repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      # Fail with something actionable. Without this, both common setup mistakes surface as an
      # opaque "npx exited 1" from wrangler several steps later. Checks the secrets exist AND
      # that the Pages project does — the second is what actually blocked the first deploys.
      - name: Preflight — Cloudflare credentials and project
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: otago-eclipse-3d
        run: |
          missing=""
          [ -z "$TOKEN" ]   && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions. See DEPLOYMENT.md."
            exit 1
          fi

          code=$(curl -s -o /tmp/cf.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/pages/projects/$PROJECT")

          case "$code" in
            200)
              echo "Secrets present and Pages project '$PROJECT' exists." ;;
            404)
              echo "::error::The Cloudflare Pages project '$PROJECT' does not exist."
              echo ""
              echo "Create it once, either in the dashboard:"
              echo "  Workers & Pages -> Create -> Pages -> Direct Upload, named exactly: $PROJECT"
              echo ""
              echo "or from a terminal with CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID set:"
              echo "  npx wrangler pages project create $PROJECT --production-branch=main"
              echo ""
              echo "Everything else is ready: tests passed and the credentials work."
              exit 1 ;;
            401|403)
              echo "::error::Cloudflare rejected the API token (HTTP $code)."
              echo "The token needs Account -> Cloudflare Pages -> Edit, and must belong to"
              echo "the account in CLOUDFLARE_ACCOUNT_ID."
              exit 1 ;;
            *)
              echo "::warning::Unexpected HTTP $code checking the Pages project; continuing anyway."
              head -c 400 /tmp/cf.json || true ;;
          esac

      # Assemble exactly what should be public. The precompute pipeline, tests and CI config
      # stay out of the deployed artifact.
      - name: Assemble dist/
        run: |
          mkdir -p dist
          cp index.html map.html app.css viewpoints.json social-card.svg _headers dist/
          echo "Deploying:"; ls -lh dist/

      - name: Publish
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-dirty: the checkout is clean, but dist/ is assembled at build time and
          # wrangler flags any untracked path in a git working tree.
          command: >-
            pages deploy dist
            --project-name=otago-eclipse-3d
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true
